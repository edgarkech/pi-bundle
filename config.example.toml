# pi-bundle — zentrale Konfiguration (Instanz-Daten; nie system-geschrieben).
#
# Dieses Beispiel dient als Vorlage. Für den Betrieb wird sie nach
# `<BUNDLE_ROOT>/config.toml` kopiert und Instanz-Daten eingetragen.
# Der Bundle-Root: Env `PI_BUNDLE_HOME` > Standard `~/.pi/pi-bundle`.
#
# Regeln:
#   * Eine Konfigurationsquelle — diese Datei ist die Einzige des Produkts.
#   * Nie system-geschrieben (user-managed), keine Secrets.
#   * Ab Schritt 4b sind `[worker]`, `[roles.*]` und `[models]` funktional
#     (Worker-Kern + Watchdog); `[dispatch]`/`[trigger]` folgen in 4c.

# ---------------------------------------------------------------------------
# [paths] — Instanz-Pfade (Root ergibt sich, Details hier)
# ---------------------------------------------------------------------------
[paths]
# Memory-Basis, RELATIV zum Bundle-Root (muss innerhalb des Roots liegen —
# kein Schreibzugriff außerhalb). Unter dieser Basis liegen die Pfad-Schemata
# `topics/<name>/sockel.md` · `provenienz.md` · `snapshots/` · `staging/…` ·
# `digest/…`. In Fachsprache des CONCEPT ist das das Verzeichnis `memory/`.
memory = "memory"

# Quelle der unverdichteten Sessions (NUR LESEN: Digest-Bau, Pipeline-Zähler).
# Die Engine schreibt nie dorthin. Default: `~/.pi/pi-bundle/sessions`.
#sessions_root = "~/.pi/pi-bundle/sessions"

# ---------------------------------------------------------------------------
# [memory] — Spielarten-/Auto-Commit-Einstellungen
# ---------------------------------------------------------------------------
[memory]
#auto_commit_default = false

# ---------------------------------------------------------------------------
# [worker] — Watchdog / Task-Ausführung (funktional ab 4b)
# ---------------------------------------------------------------------------
# Poll-Intervall des Daemons, Standard-Modell, Timeout- und Task-Grenzen.
# Serial: ein laufender Task gleichzeitig (bewusstes Design).
[worker]
# Poll-Intervall des Watchdog in Sekunden.
poll_seconds = 5
# Standard-Modell (Fallback der Auflösungskette: --model > [roles.<role>].model
# > [worker].default_model). Muss in [models].available stehen. 'CLOUD' bleibt
# zusätzlich als expliziter Wert erlaubt.
default_model = "qwen38-27b"
# Standard-Timeout in Sekunden für Tasks, die kein eigenes --timeout tragen.
default_timeout_seconds = 3600
# Einzeiler-Regel HART: --task ≤ max_task_chars Zeichen, sonst Exit != 0.
# Bei komplexen Aufträgen zuerst ein minimales Konzept ins Projektverzeichnis
# schreiben und per --spec verweisen.
max_task_chars = 250
# Rollen, die IMMER ein --deliverable-Ziel verlangen (Validator-Gate).
deliverable_pflicht_roles = ["coder"]
# Optionaler System-Prompt-Pfad für den pi -p-Aufruf (falls vorhanden).
#system_prompt = "/pfad/zu/WORKER_SYSTEM.md"

# [worker.router] — optional: Modell-Load/Unload-Polling je Instanz.
# Wenn diese Tabelle fehlt, wird der Modell-Lifecycle übersprungen (Watchdog
# startet direkt; kein Router-Kontakt). Nur setzen, wenn ein llama.cpp-Router
# lokal erreichbar ist.
#[worker.router]
#base_url = "http://127.0.0.1:8080"
#load_timeout_sec = 120
#unload_stop_timeout_sec = 30
#retry_backoff_sec = [10, 30, 60]

# ---------------------------------------------------------------------------
# [roles.<name>] — je Rolle: Tools, Wissensquellen, Modell (funktional ab 4b)
# ---------------------------------------------------------------------------
# Rollen-Setup kommt aus der Rolle, nie aus dem Task (CONCEPT §6). Die
# gültigen Rollen ergeben sich aus genau diesen Tabellen. `tools` sind die
# erlaubten Tools des Rollen-Setups; `model` ist der Modell-Alias dieser Rolle
# (Auflösungskette, Fallback [worker].default_model).
#
# Der Verdichter (CONCEPT §9) ist die Rolle `curator`; Aufgaben laufen auf
# derselben Queue wie alle übrigen Rollen.
[roles.coder]
tools = ["bash", "read", "write", "edit", "web_search", "web_fetch"]
wissensquellen = ["learnings/coder-lessons.md"]
model = "qwen38-27b"

[roles.researcher]
tools = ["web_search", "web_fetch", "read", "write"]
wissensquellen = ["learnings/researcher-lessons.md"]
model = "qwen38-27b"

[roles.architect]
tools = ["read", "write", "edit", "bash"]
wissensquellen = ["learnings/architect-lessons.md"]
model = "qwen38-27b"

[roles.admin]
tools = ["bash", "read", "write", "edit"]
wissensquellen = ["learnings/admin-lessons.md"]
model = "qwen38-27b"

[roles.curator]
tools = ["read", "write", "bash"]
wissensquellen = ["learnings/curator-lessons.md"]
model = "qwen38-27b"

# ---------------------------------------------------------------------------
# [models] — Modell-Aliase der Instanz (funktional ab 4b)
# ---------------------------------------------------------------------------
# `available` ist die Whitelist der lokalen Modell-Aliase (Modell-Gate für
# Validate/Resolve; CLOUD bleibt zusätzlich erlaubt). Jeder Alias hier ist im
# lokalen Modell-Pool der pi-Installation registriert.
[models]
available = ["qwen38-27b", "qwen14b-q8"]
# Fallback, falls [worker].default_model fehlt.
default = "qwen38-27b"
# Cloud-Default für CLOUD-Tasks (Alias → Provider/ID im pi-Modell-Pool).
#cloud_provider = "CLOUD"
#cloud_default_model = "cloud"

# ---------------------------------------------------------------------------
# [dispatch] — Session-Typ → Verdichtungs-Lauf (Platzhalter, spätere Schritte)
# ---------------------------------------------------------------------------
# Ersetzt eine separate Matrix-Datei: je Zeile session_typ → Profil
# (topic/domain) + Auto-Verhalten (ja/nein). Der Nacht-Sweep führt die
# `auto=ja`-Zeilen mit Provenienz „auto" aus.
#[[dispatch]]
#session_typ = "default"
#profil = "topic"
#auto = "nein"

# ---------------------------------------------------------------------------
# [trigger] — Nacht-Sweep / Session-Ende (Platzhalter, spätere Schritte)
# ---------------------------------------------------------------------------
# Infrastruktur in Code (hooks/), keine Agent-Arbeit in der Session.
[trigger]
#sweep_zeit = "02:00"
#session_ende = "an"
